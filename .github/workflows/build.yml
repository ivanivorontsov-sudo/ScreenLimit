name: Build signed APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag / run number
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.1.${GITHUB_RUN_NUMBER}-ci" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Restore release keystore (dedicated key, never debug)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/stopscreen-release.jks
          echo "SIGNING_STORE_FILE=keystore/stopscreen-release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --stacktrace testReleaseUnitTest

      - name: Assemble signed release
        if: github.event_name != 'pull_request'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --stacktrace assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/stop-ekran-${VERSION_NAME}.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "dist/stop-ekran-${VERSION_NAME}.apk" | tee dist/signature.txt
          ls -l dist

      - name: Check signing certificate
        if: github.event_name != 'pull_request'
        run: |
          grep -i "SHA-256 digest: 38f3df0e636afbc3188673033458912ae27d5099431cd3d66170652e13bff4ec" dist/signature.txt \
            || { echo "::error::APK is not signed with the dedicated release key"; exit 1; }

      # Artifact storage quota is exhausted until 2026-11-01: never fail the build because of it.
      - name: Upload artifact (best effort)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: stop-ekran-apk
          path: dist/*.apk
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="dist/stop-ekran-${VERSION_NAME}.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --title "Стоп-экран ${VERSION_NAME}" --notes-file RELEASE_NOTES.md
          fi
